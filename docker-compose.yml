services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=unleash
      - POSTGRES_USER=unleash
      - POSTGRES_PASSWORD=unleash
    ports:
      - "5432:5432"
    volumes:
      - unleash_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash -d unleash"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop-net

  unleash-server:
    image: unleashorg/unleash-server:latest
    ports:
      - "4242:4242"
    environment:
      - DATABASE_URL=postgres://unleash:unleash@postgres:5432/unleash
      - DATABASE_SSL=false
      # default admin creds via env vars
      - UNLEASH_DEFAULT_ADMIN_USERNAME=admin
      - UNLEASH_DEFAULT_ADMIN_PASSWORD=unleash4all
      # Create admin token on first startup (when DB has no tokens yet)
      - INIT_ADMIN_API_TOKENS=*:*.admin-token
      - INIT_CLIENT_API_TOKENS=default:development.default-token
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4242/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop-net

  product-service:
    build: ./product-service
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - UNLEASH_API_URL=http://unleash-server:4242/api
      - UNLEASH_API_TOKEN=default-token
    depends_on:
      unleash-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop-net

  order-service:
    build: ./order-service
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - PRODUCT_SERVICE_URL=http://product-service:8081
      - UNLEASH_API_URL=http://unleash-server:4242/api
      - UNLEASH_API_TOKEN=default-token
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - shop-net

volumes:
  unleash_data:

networks:
  shop-net:
    driver: bridge