name: CI - Feature Flags (Unleash)

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    name: Job 1 - Build & Test (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test - Product Service
        working-directory: product-service
        run: mvn -B -DskipTests=false test package

      - name: Build & Test - Order Service
        working-directory: order-service
        run: mvn -B -DskipTests=false test package

  docker-integration:
    name: Job 2 - Docker Build & Integration Test
    runs-on: ubuntu-latest
    needs: build-test

    env:
      # Must match whatever your docker-compose.yml uses for Unleash init tokens
      UNLEASH_ADMIN_TOKEN: admin-token
      UNLEASH_ADMIN_USER: admin
      UNLEASH_ADMIN_PASSWORD: admin123

      # If your services use client token:
      UNLEASH_CLIENT_TOKEN: default-token

      # Local ports (compose maps unleash to 4242, product 8081, order 8082)
      UNLEASH_URL: http://localhost:4242
      PRODUCT_URL: http://localhost:8081
      ORDER_URL: http://localhost:8082

      # Unleash environment you are using in compose (per your compose: development)
      UNLEASH_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Build Docker images + Start stack
        run: |
          docker compose up -d --build

      - name: Wait for postgres to be healthy
        run: |
          set -e
          echo "Waiting for postgres..."
          for i in {1..90}; do
            PG_ID=$(docker compose ps -q postgres || true)
            if [ -n "$PG_ID" ]; then
              STATUS=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' "$PG_ID" 2>/dev/null || true)
              echo "postgres status: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "postgres healthy"
                exit 0
              fi
            fi
            sleep 2
          done

          echo "Waiting for unleash..."
          for i in {1..90}; do
            if curl -fsS "$UNLEASH_URL/health" >/dev/null; then
              echo "unleash healthy"
              break
            fi
            sleep 2
            if [ $i -eq 90 ]; then
              echo "unleash not healthy in time"
              docker compose ps
              docker compose logs unleash-server
              exit 1
            fi
          done

          echo "Waiting for product-service..."
          for i in {1..90}; do
            if curl -fsS "$PRODUCT_URL/actuator/health" | jq -e '.status=="UP"' >/dev/null; then
              echo "product-service UP"
              break
            fi
            sleep 2
            if [ $i -eq 90 ]; then
              echo "product-service not healthy in time"
              docker compose ps
              docker compose logs product-service
              exit 1
            fi
          done

          echo "Waiting for order-service..."
          for i in {1..90}; do
            if curl -fsS "$ORDER_URL/actuator/health" | jq -e '.status=="UP"' >/dev/null; then
              echo "order-service UP"
              break
            fi
            sleep 2
            if [ $i -eq 90 ]; then
              echo "order-service not healthy in time"
              docker compose ps
              docker compose logs order-service
              exit 1
            fi
          done

      - name: Initialize feature flags in Unleash (create if missing)
        run: |
          set -e

          create_flag () {
            local name="$1"
            local desc="$2"
            # Create flag (idempotent: ignore if already exists)
            curl -s -o /dev/null -w "%{http_code}" \
              -X POST "$UNLEASH_URL/api/admin/projects/default/features" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$name\",\"type\":\"release\",\"description\":\"$desc\"}" \
              | tee /tmp/create_code.txt

            code=$(cat /tmp/create_code.txt)
            if [ "$code" = "409" ]; then
              echo "Flag $name already exists (409) - OK"
            elif [ "$code" = "201" ] || [ "$code" = "200" ]; then
              echo "Flag $name created"
            else
              echo "Unexpected create response code for $name: $code"
              # still continue, but print server info
            fi
          }

          create_flag "premium-pricing" "Enable premium pricing endpoint behavior"
          create_flag "order-notifications" "Enable order notification logging"
          create_flag "bulk-order-discount" "Enable bulk discount when qty > 5"

          echo "Ensure flags exist:"
          curl -fsS "$UNLEASH_URL/api/admin/projects/default/features" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" | jq '.[].name' | sort

      - name: Toggle flags via Unleash API (ON/OFF check)
        run: |
          set -e

          # Turn ON all flags (explicit)
          for f in premium-pricing order-notifications bulk-order-discount; do
            curl -fsS -X POST \
              "$UNLEASH_URL/api/admin/projects/default/features/$f/environments/$UNLEASH_ENV/on" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null
          done

          # Validate at least one flag state returned from Unleash API
          curl -fsS "$UNLEASH_URL/api/admin/projects/default/features" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" | jq 'length' | grep -q '[1-9]'

      - name: Integration Test - premium-pricing affects /api/products/premium
        run: |
          set -e

          # With premium-pricing ON
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/premium-pricing/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          ON_RESP=$(curl -fsS "$PRODUCT_URL/api/products/premium")
          echo "Premium ON response: $ON_RESP"

          # With premium-pricing OFF
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/premium-pricing/environments/$UNLEASH_ENV/off" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          OFF_RESP=$(curl -fsS "$PRODUCT_URL/api/products/premium")
          echo "Premium OFF response: $OFF_RESP"

          # Replace these assertions based on YOUR implementation:
          # Example: when OFF it returns empty array, when ON it returns non-empty
          echo "$ON_RESP"  | jq -e 'length >= 0' >/dev/null
          echo "$OFF_RESP" | jq -e 'length >= 0' >/dev/null

          # If your endpoint behavior is something like "prices differ", do a stronger check:
          # - e.g. compare a field or count difference.

      - name: Integration Test - order-notifications affects order creation logging
        run: |
          set -e

          # Clear old logs (restart just order-service to make log grep clean)
          docker compose restart order-service
          sleep 5

          # Turn ON order-notifications
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/order-notifications/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          # Create an order (adjust payload to match your controller)
          curl -fsS -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":1}' >/dev/null || true

          LOGS_ON=$(docker compose logs --no-color order-service | tail -n 200)
          echo "$LOGS_ON" | grep -q "ORDER NOTIFICATION" || (echo "Expected log not found when flag ON" && exit 1)

          # Restart again to clean logs
          docker compose restart order-service
          sleep 5

          # Turn OFF order-notifications
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/order-notifications/environments/$UNLEASH_ENV/off" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          curl -fsS -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":1}' >/dev/null || true

          LOGS_OFF=$(docker compose logs --no-color order-service | tail -n 200)
          echo "$LOGS_OFF" | grep -q "ORDER NOTIFICATION" && (echo "Log found even when flag OFF" && exit 1) || true

      - name: Integration Test - bulk-order-discount affects order pricing
        run: |
          set -e

          # Turn ON bulk-order-discount
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/bulk-order-discount/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          # Create order with qty > 5
          RESP_ON=$(curl -fsS -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":6}')
          echo "Bulk ON order response: $RESP_ON"

          TOTAL_ON=$(echo "$RESP_ON" | jq -r '.totalPrice')

          # Turn OFF bulk-order-discount
          curl -fsS -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/bulk-order-discount/environments/$UNLEASH_ENV/off" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null

          RESP_OFF=$(curl -fsS -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":6}')
          echo "Bulk OFF order response: $RESP_OFF"

          TOTAL_OFF=$(echo "$RESP_OFF" | jq -r '.totalPrice')

          # Strong assertion: ON total must be less than OFF total
          python3 - <<'PY'
          import sys
          on=float("$TOTAL_ON")
          off=float("$TOTAL_OFF")
          print("TOTAL_ON=",on,"TOTAL_OFF=",off)
          assert on < off, "Expected discounted total (ON) < non-discounted total (OFF)"
          PY

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          docker system prune -af || true

  feature-flag-validation:
    name: Job 3 - Feature Flag Validation
    runs-on: ubuntu-latest
    needs: docker-integration

    env:
      UNLEASH_ADMIN_TOKEN: admin-token
      UNLEASH_URL: http://localhost:4242
      UNLEASH_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools (jq, curl)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Start stack (validation job)
        run: |
          docker compose up -d --build

      - name: Wait for Unleash
        run: |
          for i in {1..90}; do
            if curl -fsS "$UNLEASH_URL/health" >/dev/null; then
              echo "unleash healthy"
              break
            fi
            sleep 2
            if [ $i -eq 90 ]; then
              docker compose ps
              docker compose logs unleash-server
              exit 1
            fi
          done

      - name: Verify all 3 flags exist
        run: |
          set -e
          FLAGS=$(curl -fsS "$UNLEASH_URL/api/admin/projects/default/features" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" | jq -r '.[].name' | sort)
          
          echo "$FLAGS"
          echo "$FLAGS" | grep -q "premium-pricing"
          echo "$FLAGS" | grep -q "order-notifications"
          echo "$FLAGS" | grep -q "bulk-order-discount"

      - name: Test toggle behavior (ON/OFF)
        run: |
          set -e
          for f in premium-pricing order-notifications bulk-order-discount; do
            curl -fsS -X POST \
              "$UNLEASH_URL/api/admin/projects/default/features/$f/environments/$UNLEASH_ENV/on" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null
          
            curl -fsS -X POST \
              "$UNLEASH_URL/api/admin/projects/default/features/$f/environments/$UNLEASH_ENV/off" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null
          done
          echo "Toggles ON/OFF executed successfully."

      - name: Validate fallback when flag doesn't exist
        run: |
          set -e
          
          # Delete a flag temporarily (choose one), then recreate it.
          # If your course expects "fallback behavior" (your code uses isEnabled(flag,false)),
          # then when missing, services should behave as if it is OFF.
          
          FLAG="bulk-order-discount"
          
          # Delete
          curl -fsS -X DELETE \
            "$UNLEASH_URL/api/admin/projects/default/features/$FLAG" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" >/dev/null || true
          
          # Confirm missing
          curl -fsS "$UNLEASH_URL/api/admin/projects/default/features" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" | jq -r '.[].name' | grep -q "$FLAG" \
            && (echo "Flag still exists, expected deleted" && exit 1) || true
          
          echo "Flag deleted. Your service should now fallback to OFF for that flag."
          
          # Recreate (so future jobs/dev runs are fine)
          curl -fsS -X POST "$UNLEASH_URL/api/admin/projects/default/features" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$FLAG\",\"type\":\"release\",\"description\":\"Recreated for CI\"}" >/dev/null

      - name: Tear down
        if: always()
        run: |
          docker compose down -v

  code-quality:
    name: Bonus - Code Quality (Optional)
    runs-on: ubuntu-latest
    needs: build-test
    if: false  # <- change to true if you want this job enabled

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Example: SpotBugs (only works if you configured the plugin in pom.xml)
      - name: SpotBugs - Product Service
        working-directory: product-service
        run: mvn -B spotbugs:check

      - name: SpotBugs - Order Service
        working-directory: order-service
        run: mvn -B spotbugs:check

      # Example coverage gate (requires Jacoco configured in pom.xml)
      - name: Coverage Gate - Product Service
        working-directory: product-service
        run: mvn -B test jacoco:report

      - name: Coverage Gate - Order Service
        working-directory: order-service
        run: mvn -B test jacoco:report
