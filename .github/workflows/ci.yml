name: CI - Feature Flags (Unleash)

on:
  push:
    branches: ["main"]
  pull_request:

jobs:

  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Product Service
        working-directory: product-service
        run: mvn -B test package

      - name: Build Order Service
        working-directory: order-service
        run: mvn -B test package


  docker-integration:
    runs-on: ubuntu-latest
    needs: build-test

    env:
      UNLEASH_URL: http://localhost:4242
      PRODUCT_URL: http://localhost:8081
      ORDER_URL: http://localhost:8082
      UNLEASH_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Install jq + curl
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Start full stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          set -e

          wait_http() {
            url=$1
            name=$2
            for i in {1..90}; do
              if curl -fsS "$url" >/dev/null; then
                echo "$name ready"
                return 0
              fi
              sleep 2
            done
            echo "$name failed to start"
            docker compose logs
            exit 1
          }

          wait_http "$UNLEASH_URL/health" "Unleash"
          wait_http "$PRODUCT_URL/actuator/health" "Product Service"
          wait_http "$ORDER_URL/actuator/health" "Order Service"

      # LOGIN TO UNLEASH
      - name: Login to Unleash and get admin token
        run: |
          set -e

          LOGIN_RESPONSE=$(curl -s -X POST "$UNLEASH_URL/api/simple/login" \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"unleash4all"}')

          echo "$LOGIN_RESPONSE"

          SESSION_TOKEN=$(echo "$LOGIN_RESPONSE" | jq -r '.access_token')

          if [ "$SESSION_TOKEN" = "null" ] || [ -z "$SESSION_TOKEN" ]; then
            echo "Failed to login to Unleash"
            exit 1
          fi

          echo "UNLEASH_ADMIN_TOKEN=$SESSION_TOKEN" >> $GITHUB_ENV

      - name: Create and enable feature flags
        run: |
          set -e

          create_flag() {
            NAME=$1
            DESC=$2

            curl -s -X POST \
              "$UNLEASH_URL/api/admin/projects/default/features" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$NAME\",\"type\":\"release\",\"description\":\"$DESC\"}" || true

            curl -s -X POST \
              "$UNLEASH_URL/api/admin/projects/default/features/$NAME/environments/$UNLEASH_ENV" \
              -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN" || true
          }

          create_flag premium-pricing "Premium pricing discount"
          create_flag order-notifications "Order notification logging"
          create_flag bulk-order-discount "Bulk order discount"

      - name: Test premium-pricing
        run: |
          set -e

          curl -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/premium-pricing/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN"

          ON=$(curl -s "$PRODUCT_URL/api/products/premium")

          curl -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/premium-pricing/environments/$UNLEASH_ENV/off" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN"

          OFF=$(curl -s "$PRODUCT_URL/api/products/premium")

          echo "$ON" | jq .
          echo "$OFF" | jq .

      - name: Test order-notifications
        run: |
          set -e

          curl -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/order-notifications/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN"

          curl -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":1}'

          sleep 2

          docker compose logs order-service | grep "ORDER NOTIFICATION"

      - name: Test bulk-order-discount
        run: |
          set -e

          curl -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/bulk-order-discount/environments/$UNLEASH_ENV/on" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN"

          RESP_ON=$(curl -s -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":6}')

          curl -X POST \
            "$UNLEASH_URL/api/admin/projects/default/features/bulk-order-discount/environments/$UNLEASH_ENV/off" \
            -H "Authorization: Bearer $UNLEASH_ADMIN_TOKEN"

          RESP_OFF=$(curl -s -X POST "$ORDER_URL/api/orders" \
            -H "Content-Type: application/json" \
            -d '{"productId":1,"quantity":6}')

          ON_TOTAL=$(echo "$RESP_ON" | jq -r '.totalPrice')
          OFF_TOTAL=$(echo "$RESP_OFF" | jq -r '.totalPrice')

          python3 -c "assert float('$ON_TOTAL') < float('$OFF_TOTAL')"

      - name: Tear down
        if: always()
        run: docker compose down -v